<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fraunces: a characterful display serif used only for the app's biggest
         headline moments (the landing hero title, the dashboard welcome
         heading) — see --font-display in index.css. Everything else stays on
         Work Sans/Inter. -->
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@500;600;700&family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <title>QuickCheck Clinic</title>
    <script>
      // Sets data-theme before first paint (same localStorage key ThemeContext
      // reads/writes, see src/theme/ThemeContext.jsx) so the page never flashes
      // the wrong theme on load/refresh — must run synchronously, before any
      // CSS below applies, hence a plain inline script rather than a module.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", stored === "light" ? "light" : "dark");
      })();
    </script>
    <script>
      // Browsers auto-restore the previous scroll position on a page reload —
      // fine for most pages, but it fights the landing page's own refresh
      // behavior (see Landing.jsx: a refresh should always land at the top
      // hero, not wherever an earlier in-page nav click left the URL hash/
      // scroll position). Opting out globally, this early, is what makes that
      // possible — by the time React mounts, the browser has already restored
      // scroll if this doesn't run first.
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
